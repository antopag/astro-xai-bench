[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astro-xai-bench"
version = "0.1.0"
description = "Benchmark framework for astronomical transient classification with Explainable AI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Your Name", email = "your@email.com" },
]
keywords = ["astronomy", "transients", "deep-learning", "explainability", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "timm>=0.9",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "shap>=0.43",
    "captum>=0.7",
    "numpy>=1.25",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pyyaml>=6.0",
    "loguru>=0.7",
    "tqdm>=4.66",
    "pyts>=0.13",           # for GAF (Gramian Angular Field) transforms
    "kaggle>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "ipykernel>=6.25",
    "jupyterlab>=4.0",
]

[project.scripts]
astro-xai-bench = "scripts.run_benchmark:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
